<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lietaus radaras — kur dabar lyja</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,sans-serif;background:#0f172a}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  .panel{
    position:absolute;left:12px;bottom:12px;z-index:1000;
    background:rgba(15,23,42,.92);color:#e2e8f0;border:1px solid #334155;
    border-radius:12px;padding:12px 14px;font-size:.9rem;min-width:280px;max-width:min(360px,calc(100vw - 24px));
  }
  .panel h1{font-size:1rem;margin:0 0 8px}
  .row{display:flex;align-items:center;gap:10px;margin-top:6px}
  button{background:#273449;color:#e2e8f0;border:1px solid #334155;border-radius:8px;
    padding:6px 12px;cursor:pointer;font-size:1rem}
  button:hover{background:#334155}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:#2563eb;border-color:#3b82f6;font-size:.95rem;font-weight:600;flex:1}
  button.primary:hover{background:#1d4ed8}
  button.ghost{font-size:.8rem;padding:5px 10px}
  input[type=range]{flex:1}
  .time{font-variant-numeric:tabular-nums;color:#38bdf8;font-weight:600}
  .legend{margin-top:8px;font-size:.75rem;color:#94a3b8;line-height:1.5}
  a{color:#38bdf8}
  .status{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1000;
    background:rgba(15,23,42,.9);color:#e2e8f0;border:1px solid #334155;border-radius:8px;
    padding:6px 14px;font-size:.85rem}
  .sep{border-top:1px solid #334155;margin:10px 0 6px}
  .vieta{font-size:.8rem;color:#cbd5e1;line-height:1.45;margin-top:6px}
  .vieta b{color:#60a5fa}
  .klaida{color:#fca5a5}
  .hidden{display:none}
</style>
</head>
<body>
<div id="map"></div>
<div class="status" id="status">Kraunami radaro kadrai…</div>

<div class="panel">
  <h1>🌧️ Lietaus radaras</h1>
  <div class="row">
    <button id="play">⏸</button>
    <input type="range" id="slider" min="0" max="0" value="0">
  </div>
  <div class="row"><span>Kadras:</span> <span class="time" id="time">—</span></div>

  <div id="vietaBlokas" class="hidden">
    <div class="sep"></div>
    <div class="row">
      <button class="primary" id="fiksuoti">📍 Fiksuoti mano vietą</button>
    </div>
    <div class="vieta" id="vietaInfo">Antrasis taškas nenustatytas.</div>
    <div class="row" id="jungiklioEil" style="display:none">
      <button class="ghost" id="jungiklis">🚫 Išjungti antrą tašką</button>
    </div>
  </div>

  <div class="legend">🔴 Namai (Polocko 32C) &middot; 🔵 mano vieta &middot; žiedai kas 25 km (iki 100 km)<br>
    Silpna 🟦🟩 → vidutinė 🟨 → smarki 🟧🟥</div>
  <div class="legend">Šaltinis: <a href="https://www.meteo.lt" target="_blank">Lietuvos hidrometeorologijos tarnyba</a></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var BOUNDS = [[59.701667, 15.618611],[49.876389, 34.313611]];
var IMGBASE = "https://new.meteo.lt/meteo_jobs/radaru_informacija/Header_Radar-composite-";
var PT = [54.6824221, 25.3072029];              // namai — Polocko 32C, Vilnius

var SB_URL = "https://xmhplprqemgsvvrnmtju.supabase.co";
var SB_KEY = "sb_publishable_j0BUqc9Fl7MTd7XfTirGGQ_N5IWoAS4";

var map = L.map('map',{zoomControl:true}).setView([54.9, 24.0], 7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap, © CARTO', maxZoom:19}).addTo(map);

// --- namų taškas su žiedais ---
[25000,50000,75000,100000].forEach(function(r){
  L.circle(PT,{radius:r,color:'#64748b',weight:1,dashArray:'5',fill:false}).addTo(map);
});
L.circleMarker(PT,{radius:7,color:'#fff',weight:2,fillColor:'#ef4444',fillOpacity:1})
  .addTo(map).bindPopup('Namai — Polocko 32C');

// ===================== MANO VIETA (GPS) =====================
// Slaptas raktas ateina laiško nuorodoje (#k=...) ir įsimenamas naršyklėje.
var raktas = null;
(function(){
  var m = (location.hash + '&' + location.search).match(/[#?&]k=([A-Za-z0-9]+)/);
  if(m){
    raktas = m[1];
    try{ localStorage.setItem('radaroRaktas', raktas); }catch(e){}
    history.replaceState(null,'',location.pathname);      // raktas dingsta iš adreso juostos
  } else {
    try{ raktas = localStorage.getItem('radaroRaktas'); }catch(e){}
  }
})();

var vietaSluoksniai = [], vietaBlokas = document.getElementById('vietaBlokas');
var vietaInfo = document.getElementById('vietaInfo');
var fiksuotiBtn = document.getElementById('fiksuoti');
var jungiklisBtn = document.getElementById('jungiklis');
var jungiklioEil = document.getElementById('jungiklioEil');
var esamaVieta = null;

if(raktas){ vietaBlokas.classList.remove('hidden'); gautiVieta(); setInterval(gautiVieta, 60000); }

function rpc(vardas, kunas){
  kunas = kunas || {};
  kunas.p_raktas = raktas;
  return fetch(SB_URL + '/rest/v1/rpc/' + vardas, {
    method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body: JSON.stringify(kunas)
  }).then(function(r){
    return r.text().then(function(t){
      var d = t ? JSON.parse(t) : null;
      if(!r.ok) throw new Error((d && d.message) || ('Klaida ' + r.status));
      return d;
    });
  });
}

function braizytiVieta(v){
  vietaSluoksniai.forEach(function(l){ map.removeLayer(l); });
  vietaSluoksniai = [];
  if(!v || !v.aktyvus || v.lat == null) return;
  var p = [v.lat, v.lon];
  [25000,50000,75000,100000].forEach(function(r){
    vietaSluoksniai.push(L.circle(p,{radius:r,color:'#3b82f6',weight:1,dashArray:'5',fill:false}).addTo(map));
  });
  vietaSluoksniai.push(
    L.circleMarker(p,{radius:7,color:'#fff',weight:2,fillColor:'#2563eb',fillOpacity:1})
     .addTo(map).bindPopup('Mano vieta' + (v.adresas ? '<br>' + v.adresas : '')));
}

function rodytiBusena(v){
  esamaVieta = v;
  braizytiVieta(v);
  if(!v || v.lat == null){
    vietaInfo.textContent = 'Antrasis taškas nenustatytas.';
    jungiklioEil.style.display = 'none';
    return;
  }
  var koord = v.lat.toFixed(5) + ', ' + v.lon.toFixed(5);
  var kada = v.atnaujinta ? new Date(v.atnaujinta).toLocaleString('lt-LT',{dateStyle:'short',timeStyle:'short'}) : '';
  if(v.aktyvus){
    vietaInfo.innerHTML = '<b>' + (v.adresas || koord) + '</b><br>' +
      (v.adresas ? koord + '<br>' : '') +
      'Užfiksuota: ' + kada + (v.tikslumas_m ? ' · tikslumas ±' + Math.round(v.tikslumas_m) + ' m' : '') +
      '<br>Sekamas ir tikrinamas kartu su namais.';
    jungiklisBtn.textContent = '🚫 Išjungti antrą tašką';
  } else {
    vietaInfo.innerHTML = 'Antrasis taškas <b>išjungtas</b>.<br>Paskutinė vieta: ' + (v.adresas || koord) + ' (' + kada + ')';
    jungiklisBtn.textContent = '✅ Vėl įjungti šį tašką';
  }
  jungiklioEil.style.display = '';
}

function gautiVieta(){
  rpc('vieta_gauti').then(function(d){
    rodytiBusena(d && d.length ? d[0] : null);
  }).catch(function(e){
    vietaInfo.innerHTML = '<span class="klaida">Nepavyko gauti vietos: ' + e.message + '</span>';
  });
}

function adresoPaieska(lat,lon){
  return fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=lt&lat='+lat+'&lon='+lon)
    .then(function(r){ return r.json(); })
    .then(function(j){
      var a = j.address || {};
      var vieta = a.city || a.town || a.village || a.municipality || a.county || j.name || '';
      var gatve = a.road ? (a.road + (a.house_number ? ' ' + a.house_number : '')) : '';
      var t = [gatve, vieta].filter(Boolean).join(', ');
      return t || null;
    }).catch(function(){ return null; });
}

fiksuotiBtn.addEventListener('click', function(){
  if(!navigator.geolocation){ vietaInfo.innerHTML = '<span class="klaida">Naršyklė nepalaiko vietos nustatymo.</span>'; return; }
  fiksuotiBtn.disabled = true;
  fiksuotiBtn.textContent = '📡 Nustatoma vieta…';
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat = pos.coords.latitude, lon = pos.coords.longitude, acc = pos.coords.accuracy;
    vietaInfo.textContent = 'Vieta gauta (±' + Math.round(acc) + ' m), įrašoma…';
    adresoPaieska(lat,lon).then(function(adr){
      return rpc('vieta_irasyti', {p_lat:lat, p_lon:lon, p_tikslumas_m:acc, p_adresas:adr});
    }).then(function(){
      map.setView([lat,lon], 9);
      gautiVieta();
    }).catch(function(e){
      vietaInfo.innerHTML = '<span class="klaida">Nepavyko įrašyti: ' + e.message + '</span>';
    }).then(function(){
      fiksuotiBtn.disabled = false;
      fiksuotiBtn.textContent = '📍 Fiksuoti mano vietą';
    });
  }, function(err){
    var t = err.code === 1 ? 'neleista naudoti vietos (leisk naršyklės nustatymuose)' :
            err.code === 3 ? 'nepavyko laiku gauti GPS signalo' : 'vieta nepasiekiama';
    vietaInfo.innerHTML = '<span class="klaida">Klaida: ' + t + '.</span>';
    fiksuotiBtn.disabled = false;
    fiksuotiBtn.textContent = '📍 Fiksuoti mano vietą';
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
});

jungiklisBtn.addEventListener('click', function(){
  var naujas = !(esamaVieta && esamaVieta.aktyvus);
  jungiklisBtn.disabled = true;
  rpc('vieta_jungiklis', {p_aktyvus:naujas}).then(gautiVieta)
    .catch(function(e){ vietaInfo.innerHTML = '<span class="klaida">Nepavyko: ' + e.message + '</span>'; })
    .then(function(){ jungiklisBtn.disabled = false; });
});

// ===================== RADARO ANIMACIJA =====================
function pad(n){return (n<10?'0':'')+n;}
function tsUTC(d){return ''+d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+pad(d.getUTCHours())+pad(d.getUTCMinutes());}
function tsToLocal(ts){
  var d=new Date(Date.UTC(+ts.substr(0,4),+ts.substr(4,2)-1,+ts.substr(6,2),+ts.substr(8,2),+ts.substr(10,2)));
  return pad(d.getHours())+':'+pad(d.getMinutes());
}

var nowd=new Date(); nowd.setUTCSeconds(0,0);
nowd.setUTCMinutes(nowd.getUTCMinutes()-(nowd.getUTCMinutes()%5));
var candidates=[];
for(var i=24;i>=2;i--){ candidates.push(tsUTC(new Date(nowd.getTime()-i*5*60000))); }

var valid=[];
var checked=0;
candidates.forEach(function(ts){
  var im=new Image();
  im.onload=function(){ valid.push(ts); done(); };
  im.onerror=function(){ done(); };
  im.src=IMGBASE+ts+'.png';
});
function done(){ checked++; if(checked===candidates.length) setup(); }

var frames=[], layers={}, idx=0, playing=true, timer=null;
var slider=document.getElementById('slider');
var timeEl=document.getElementById('time');
var playBtn=document.getElementById('play');
var statusEl=document.getElementById('status');

function setup(){
  frames=valid.sort();
  if(!frames.length){ statusEl.textContent='Radaro kadrų gauti nepavyko'; return; }
  statusEl.style.display='none';
  slider.max=frames.length-1;
  frames.forEach(function(ts){
    layers[ts]=L.imageOverlay(IMGBASE+ts+'.png', BOUNDS, {opacity:0}).addTo(map);
  });
  show(frames.length-1);
  setPlaying(true);
}
function show(i){
  frames.forEach(function(ts,j){ layers[ts].setOpacity(j===i?0.7:0); });
  idx=i; slider.value=i;
  timeEl.textContent=tsToLocal(frames[i])+(i===frames.length-1?' (naujausias)':'');
}
function step(){ show((idx+1)%frames.length); }
function setPlaying(p){
  playing=p; playBtn.textContent=p?'⏸':'▶';
  if(timer){clearInterval(timer);timer=null;}
  if(p) timer=setInterval(step,700);
}
playBtn.addEventListener('click',function(){ setPlaying(!playing); });
slider.addEventListener('input',function(){ setPlaying(false); show(+slider.value); });
</script>
</body>
</html>
